<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Page</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f5f5f5;
        color: #222;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }

      main {
        background: white;
        padding: 2rem 3rem;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        text-align: center;
        max-width: 520px;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 2.5rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      a.button:hover,
      a.button:focus-visible {
        background: #1e3a8a;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Cursor</h1>
      <p>
        This starter page was generated automatically. Customize it to fit your
        project goals, add scripts, or build entire layouts from here.
      </p>
      <a class="button" href="https://cursor.sh" target="_blank" rel="noreferrer"
        >Explore Cursor</a
      >
    </main>
  </body>
</html>
